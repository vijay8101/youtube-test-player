<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Test Player</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
header{padding:14px;background:#1d1d1d;position:sticky;top:0;z-index:10}
h2{margin:0 0 10px;font-size:20px}.bar{display:flex;gap:7px}
input{flex:1;min-width:0;padding:11px;border:0;border-radius:8px}
button{border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}
.card{background:#222;border-radius:9px;overflow:hidden}.player{width:100%;aspect-ratio:16/9}
iframe{width:100%;height:100%;border:0;display:block}.info{padding:7px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.remove{padding:5px 9px;background:#444;color:#fff}.empty{text-align:center;color:#aaa;padding:35px 15px}
.note{font-size:11px;color:#aaa;margin-top:7px}
@media(max-width:600px){#grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
<h2>🎬 Video Test Player</h2>
<div class="bar">
<input id="url" placeholder="Paste YouTube URL">
<button id="add">＋ Add</button>
<button id="clear">Clear</button>
</div>
<div class="note">Playback testing • Some videos may disable embedding.</div>
</header>
<main id="grid"><div class="empty" id="empty">Paste a YouTube link to add a test player.</div></main>
<script>
const grid=document.getElementById('grid');
function getId(s){
 try{
  const u=new URL(s.trim()), h=u.hostname.replace(/^www\./,'');
  if(h==='youtu.be') return u.pathname.split('/').filter(Boolean)[0]||null;
  if(u.searchParams.get('v')) return u.searchParams.get('v');
  const p=u.pathname.split('/').filter(Boolean);
  if(['shorts','embed','live'].includes(p[0])) return p[1]||null;
 }catch(e){}
 return null;
}
function add(){
 const input=document.getElementById('url'), id=getId(input.value);
 if(!id){alert('Paste a valid YouTube URL.');return}
 document.getElementById('empty')?.remove();
 const card=document.createElement('section'); card.className='card';
 const player=document.createElement('div'); player.className='player';
 const frame=document.createElement('iframe');
 frame.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?rel=0';
 frame.title='YouTube test video'; frame.allowFullscreen=true;
 frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
 player.appendChild(frame);
 const info=document.createElement('div'); info.className='info';
 const text=document.createElement('span'); text.textContent='Video '+id;
 const x=document.createElement('button'); x.className='remove'; x.textContent='×';
 x.onclick=()=>card.remove();
 info.append(text,x); card.append(player,info); grid.appendChild(card); input.value='';
}
document.getElementById('add').onclick=add;
document.getElementById('clear').onclick=()=>grid.innerHTML='<div class="empty" id="empty">Paste a YouTube link to add a test player.</div>';
document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
</script>
</body>
</html>
